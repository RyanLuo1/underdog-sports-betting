# Thresholds, limits, and polling schedules. Values are placeholders until
# shadow-mode results are in; see the spec's Execution and risk controls section.

polling:
  hot_window_seconds: 15
  default_seconds: 120

freshness:
  max_post_age_s: 120
  max_sharp_odds_age_s: 10
  max_novig_book_age_s: 10
  min_seconds_before_start: 60

halts:
  ingestor_heartbeat_s: 120
  max_clock_drift_ms: 250

min_edge:
  news_speed: null
  stale_after_sharp_move: null
  second_order_prop: null

# Order-book recorder (scripts/run_novig_recorder.py). Novig caps one connection at
# 2048 watched markets, and an event counts as all of its markets. A full NFL week with
# props open runs to roughly 5,000-6,000 markets, so the recorder spreads events across
# several connections; the subscribe throttle is per key and shared by all of them.
recorder:
  leagues: [NFL]
  lookback_hours: 8                 # keep events that started this long ago (in play)
  horizon_hours: 168                # pick up events starting within this window, soonest first
  connections: 4                    # websocket connections, each with its own market budget
  max_markets_per_connection: 1800  # headroom under 2048 for markets that open later
  refresh_seconds: 300              # re-read the catalog and repack this often
  subscribe_batch: 16               # events per subscribe (16 tokens each, 512 burst, 4/s)
  min_free_gib: 5                   # below this, stop cleanly and log a gap
  disk_check_seconds: 120

# Nightly backup of the recorder's stream files (scripts/backup_novig_stream.py).
# A folder at the top of iCloud Drive, outside the synced Desktop and Documents.
backup:
  dest: "~/Library/Mobile Documents/com~apple~CloudDocs/novig-backups"
  warn_free_gib: 20        # disk line says WARNING and sends a notification below this
  critical_free_gib: 10    # CRITICAL, with a notification

# One-off backfill of news posts through Apify (scripts/backfill_underdog_posts.py).
# Apify's tweet-scraper is for historical backfill only: no monitoring, at least 50
# tweets per query, one run at a time.
underdog_backfill:
  account: UnderdogNFL
  start: 2026-08-04
  actor: apidojo/tweet-scraper
  sort: "Latest + Top"
  max_items_per_week: 2500   # maxItems on every run; also caps each run's charge
  budget_usd: 10             # stop before total spend in the run ledger passes this
  event_price_usd: 0.0004    # per tweet; used only if a run omits its pricing
